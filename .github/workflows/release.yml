name: Verified signed release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Configure required reviewers on this environment before creating a tag.
    environment: release
    permissions:
      contents: write
      actions: read
    steps:
      - name: Require configured release reviewers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api "repos/$GH_REPO/environments/release" > "$RUNNER_TEMP/release-environment.json"
          python3 - <<'PY'
          import json, os, pathlib
          environment = json.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'release-environment.json').read_text())
          rules = environment.get('protection_rules', [])
          assert any(rule.get('type') == 'required_reviewers' and rule.get('reviewers') for rule in rules), 'Configure required reviewers on the release environment before publishing'
          PY
      - name: Require physical-device verification for this exact tag and commit
        env:
          DEVICE_VERIFICATION_CONFIRMED: ${{ vars.DEVICE_VERIFICATION_CONFIRMED }}
          DEVICE_VERIFIED_TAG: ${{ vars.DEVICE_VERIFIED_TAG }}
          DEVICE_VERIFIED_COMMIT: ${{ vars.DEVICE_VERIFIED_COMMIT }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          test "$DEVICE_VERIFICATION_CONFIRMED" = true || { echo 'Physical-device verification has not been attested.'; exit 1; }
          test "$DEVICE_VERIFIED_TAG" = "$RELEASE_TAG" || { echo 'Device-verification attestation does not match the release tag.'; exit 1; }
          test "$DEVICE_VERIFIED_COMMIT" = "$RELEASE_COMMIT" || { echo 'Device-verification attestation does not match the tagged commit.'; exit 1; }
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected a stable version tag such as v0.1.0.'; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify Gradle wrapper
        run: echo '2db75c40782f5e8ba1fc278a5574bab070adccb2d21ca5a6e5ed840888448046  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          cache-disabled: true
      - name: Install Android build dependencies
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"'
      - name: Test and lint before signing
        run: ./gradlew --no-daemon testDebugUnitTest lintRelease
      - name: Decode signing keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64" || { echo 'Missing RELEASE_KEYSTORE_BASE64 secret.'; exit 1; }
          umask 077
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - name: Build signed release
        env:
          SIGN_RELEASE: "true"
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease
      - name: Verify APK signature, version, and alignment
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          python3 tools/verify_module.py "$apk" "$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" > "$RUNNER_TEMP/release-badging.txt"
          python3 - <<'PY'
          import os, pathlib, re
          badging = pathlib.Path(os.environ['RUNNER_TEMP'], 'release-badging.txt').read_text()
          package = re.search(r"package: name='([^']+)' versionCode='([^']+)' versionName='([^']+)'", badging)
          assert package and package[1] == 'io.github.adiker.hyperoshomefix', 'Unexpected APK package'
          assert package[3] == os.environ['RELEASE_TAG'][1:], 'Tag and APK versions differ'
          assert 'application-debuggable' not in badging, 'Release APK is debuggable'
          PY
          mkdir -p release-output
          cp "$apk" "release-output/HyperOS-Home-Fix-${RELEASE_TAG}.apk"
          cd release-output
          sha256sum ./*.apk > SHA256SUMS
      - name: Publish verified signed APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release-output/*.apk release-output/SHA256SUMS --verify-tag --title "HyperOS Home Fix $RELEASE_TAG" --generate-notes
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
